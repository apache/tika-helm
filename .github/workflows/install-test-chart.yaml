# Reusable workflow: create a kind cluster, install the tika Helm chart
# (from Artifactory Helm OCI by version or from repo at ref), then run helm test.
#
# Call with either:
#   - chart_version: install from Artifactory (requires ARTIFACTORY_* secrets)
#   - ref: install from repo at this ref (e.g. github.sha)

name: Install and Test Chart

on:
  workflow_call:
    inputs:
      chart_version:
        description: 'Chart version to install from Artifactory Helm OCI (e.g. 3.2.3-abc1234). Omit to install from repo.'
        required: false
        type: string
      ref:
        description: 'Git ref to checkout and install from (e.g. github.sha). Required when chart_version is not set.'
        required: false
        type: string
    secrets:
      ARTIFACTORY_USERNAME:
        description: 'Apache JFrog Artifactory username (required when chart_version is set)'
        required: false
      ARTIFACTORY_PASSWORD:
        description: 'Apache JFrog Artifactory password (required when chart_version is set)'
        required: false

permissions:
  contents: read

jobs:
  install-test:
    runs-on: ubuntu-latest
    steps:
      # Always checkout: local chart install needs sources; OCI path needs .github/ci manifests.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.chart_version != '' && github.sha || inputs.ref }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Log in to Helm OCI and pull chart
        if: inputs.chart_version != ''
        env:
          HELM_REPO_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          HELM_REPO_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: |
          echo "$HELM_REPO_PASSWORD" | helm registry login apache.jfrog.io \
            --username "$HELM_REPO_USERNAME" --password-stdin
          helm pull oci://apache.jfrog.io/tika-helm/tika \
            --version "${{ inputs.chart_version }}"

      - name: Install chart from Artifactory
        if: inputs.chart_version != ''
        run: |
          helm install tika tika-${{ inputs.chart_version }}.tgz \
            -n tika-test --create-namespace \
            --wait --timeout 5m

      - name: Install chart from repo
        if: inputs.chart_version == ''
        run: |
          helm install tika . \
            -n tika-test --create-namespace \
            --wait --timeout 5m

      - name: Run helm test
        run: helm test tika -n tika-test --timeout 3m

      - name: Verify Tika HTTP root
        run: |
          kubectl apply -f .github/ci/tika-http-root-check-job.yaml -n tika-test
          kubectl wait --for=condition=complete job/tika-http-root-check -n tika-test --timeout=120s
          kubectl delete job tika-http-root-check -n tika-test --ignore-not-found

      - name: Smoke Tika version, detect, metadata, and text
        run: |
          kubectl create configmap tika-smoke-schema \
            --from-file=values.schema.json=values.schema.json \
            -n tika-test --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f .github/ci/tika-ingest-check-job.yaml -n tika-test
          kubectl wait --for=condition=complete job/tika-smoke-check -n tika-test --timeout=120s
          kubectl logs job/tika-smoke-check -n tika-test
          kubectl delete job tika-smoke-check -n tika-test --ignore-not-found
          kubectl delete configmap tika-smoke-schema -n tika-test --ignore-not-found
