name: Lint and Test Charts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.list-changed.outputs.changed }}
    env:
      CT_VERSION: '3.12.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # Installed manually rather than via helm/chart-testing-action: that action
      # pulls astral-sh/setup-uv, which is not on ASF approved_patterns.yml, so the
      # workflow is rejected before any job starts. Releases are listed at:
      #   https://github.com/helm/chart-testing/releases
      # ct reads chart_schema.yaml and lintconf.yaml from /etc/ct; both ship in the tarball.
      - name: Set up chart-testing
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/ct"
          mkdir -p "$DEST"
          curl -fsSL \
            "https://github.com/helm/chart-testing/releases/download/v${CT_VERSION}/chart-testing_${CT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$DEST"
          sudo mkdir -p /etc/ct
          sudo cp "$DEST/etc/chart_schema.yaml" "$DEST/etc/lintconf.yaml" /etc/ct/
          echo "$DEST" >> "$GITHUB_PATH"

          # ct lint shells out to yamllint and yamale.
          pipx install yamllint
          pipx install yamale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }} --charts .)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --charts .
        shell: bash
      - name: Install helm-unittest
        run: |
          helm plugin uninstall unittest 2>/dev/null || true
          helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest
        shell: bash
      - name: Run unit tests
        run: helm unittest .
        shell: bash

  install-test:
    needs: lint-test
    if: needs.lint-test.outputs.changed == 'true'
    uses: ./.github/workflows/install-test-chart.yaml
    with:
      ref: ${{ github.sha }}
