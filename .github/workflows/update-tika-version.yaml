name: Update Tika Docker Image Version

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tika Docker image tag'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-tika-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine new tag
        id: new-tag
        run: |
          # Stable -full images only. Exclude SNAPSHOT / alpha / beta / rc / latest.
          STABLE_FULL_RE='^([0-9]+\.){2}[0-9]+(\.[0-9]+|-[0-9]+)?-full$'

          if [ -n "${{ github.event.inputs.tag }}" ]; then
            NEW_TAG="${{ github.event.inputs.tag }}"
          else
            URL="https://hub.docker.com/v2/repositories/apache/tika/tags?page_size=100&ordering=last_updated"
            ALL_TAGS=""
            while [ -n "$URL" ]; do
              RESPONSE=$(curl -sf "$URL") || {
                echo "::error::Failed to fetch tags from DockerHub API"
                exit 1
              }
              PAGE_TAGS=$(echo "$RESPONSE" | jq -r '.results[].name // empty')
              if [ -n "$PAGE_TAGS" ]; then
                ALL_TAGS="${ALL_TAGS}${PAGE_TAGS}"$'\n'
              fi
              URL=$(echo "$RESPONSE" | jq -r '.next // empty')
            done

            MATCHING=$(printf '%s' "$ALL_TAGS" | grep -E "$STABLE_FULL_RE" || true)
            echo "Stable -full tags from Docker Hub:"
            echo "$MATCHING"

            # sort -V treats hyphen rebuilds as prereleases. Normalize to
            # MAJOR.MINOR.PATCH.rebuild so the latest rebuild sorts highest.
            NEW_TAG=$(
              printf '%s\n' "$MATCHING" | while IFS= read -r tag || [ -n "$tag" ]; do
                [ -z "$tag" ] && continue
                base="${tag%-full}"
                if [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  key="${base}.0"
                elif [[ "$base" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
                  key="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
                elif [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  key="$base"
                else
                  continue
                fi
                printf '%s\t%s\n' "$key" "$tag"
              done | sort -V -k1,1 | tail -1 | cut -f2
            )
          fi

          if [ -z "$NEW_TAG" ]; then
            echo "::error::Could not determine the latest Tika Docker image tag"
            exit 1
          fi

          echo "Selected tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Read current appVersion
        id: current
        run: |
          CURRENT=$(grep '^appVersion:' Chart.yaml | sed 's/appVersion: *"\(.*\)"/\1/')
          echo "tag=$CURRENT" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.new-tag.outputs.tag }}" = "${{ steps.current.outputs.tag }}" ]; then
            echo "No update needed. Current version (${{ steps.current.outputs.tag }}) is already the latest."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update available: ${{ steps.current.outputs.tag }} -> ${{ steps.new-tag.outputs.tag }}"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Derive chart version
        if: steps.compare.outputs.updated == 'true'
        id: chart-version
        run: |
          # Chart version must be SemVer MAJOR.MINOR.PATCH (Artifact Hub / Helm OCI).
          # Drop a trailing four-part or hyphen rebuild; never emit a prerelease.
          NEW_TAG="${{ steps.new-tag.outputs.tag }}"
          BASE="${NEW_TAG%-full}"
          CHART_VERSION=""
          if [[ "$BASE" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
            CHART_VERSION="${BASH_REMATCH[1]}"
          elif [[ "$BASE" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+$ ]]; then
            CHART_VERSION="${BASH_REMATCH[1]}"
          elif [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHART_VERSION="$BASE"
          fi

          if ! [[ "$CHART_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not derive SemVer MAJOR.MINOR.PATCH chart version from tag ${NEW_TAG}"
            exit 1
          fi

          echo "Derived chart version: $CHART_VERSION"
          echo "version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Update version files
        if: steps.compare.outputs.updated == 'true'
        run: |
          NEW_TAG="${{ steps.new-tag.outputs.tag }}"
          CHART_VERSION="${{ steps.chart-version.outputs.version }}"
          OLD_TAG="${{ steps.current.outputs.tag }}"

          sed -i "s/^appVersion: \".*\"/appVersion: \"${NEW_TAG}\"/" Chart.yaml
          sed -i "s/^version: \".*\"/version: \"${CHART_VERSION}\"/" Chart.yaml

          sed -i "s/tag: '.*'/tag: '${NEW_TAG}'/" values.yaml

          sed -i "s/\"default\": \"${OLD_TAG}\"/\"default\": \"${NEW_TAG}\"/" values.schema.json
        shell: bash

      - name: Install and run helm-docs
        if: steps.compare.outputs.updated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: norwoodj/helm-docs
        run: |
          set -euo pipefail
          RELEASE="$(gh release view --json=name,assets)"
          VERSION="$(jq -r '.name' <<<"$RELEASE")"
          echo "Installing helm-docs $VERSION..."
          DEST="$RUNNER_TEMP/helm-docs"
          ASSET="$(jq -r '.assets[].name | select(ascii_downcase | test("linux_(amd64|x86_64).tar.gz$"))' <<<"$RELEASE")"
          mkdir -p "$DEST"
          cd "$DEST"
          gh release download "$VERSION" --pattern="$ASSET" --output=- | tar -xzf - helm-docs
          ./helm-docs -c "$GITHUB_WORKSPACE"

      - name: Create Pull Request
        if: steps.compare.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-update/tika-${{ steps.new-tag.outputs.tag }}
          commit-message: "Bump Apache Tika Docker image to ${{ steps.new-tag.outputs.tag }}"
          title: "Bump Apache Tika Docker image to ${{ steps.new-tag.outputs.tag }}"
          body: |
            Automated version bump of the Apache Tika Docker image.

            **Old version:** `${{ steps.current.outputs.tag }}`
            **New version:** `${{ steps.new-tag.outputs.tag }}`
            **Chart version:** `${{ steps.chart-version.outputs.version }}`

            [View available tags on Docker Hub](https://hub.docker.com/r/apache/tika/tags)
          labels: |
            dependencies
            automated
