---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ include "tika-helm.fullname" . }}-test-values"
  namespace: {{ include "tika-helm.namespace" . }}
  labels:
    {{- include "tika-helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-1"
data:
  # .Files cannot read values.schema.json, so ingest the release values, which
  # are an equivalent JSON document, rather than ship a sample file.
  values.json: |
{{ .Values | toPrettyJson | indent 4 }}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "tika-helm.fullname" . }}-test-connection"
  namespace: {{ include "tika-helm.namespace" . }}
  labels:
    {{- include "tika-helm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "0"
spec:
  containers:
    - name: ingest
      image: curlimages/curl:8.16.0
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          SAMPLE=/sample/values.json
          BASE=http://{{ include "tika-helm.fullname" . }}:{{ .Values.service.port }}
          test -s "$SAMPLE"

          ver=$(curl -sS -f "$BASE/version")
          echo "$ver"
          echo "$ver" | grep -q "Apache Tika"

          mime=$(curl -sS -f -T "$SAMPLE" \
            -H "Content-Disposition: attachment; filename=values.json" \
            "$BASE/detect" | tr -d '\r')
          echo "$mime"
          echo "$mime" | grep -qi "json"

          meta=$(curl -sS -f -T "$SAMPLE" \
            -H "Accept: application/json" \
            -H "Content-Disposition: attachment; filename=values.json" \
            "$BASE/meta")
          echo "$meta"
          echo "$meta" | grep -qi "Content-Type"
          echo "$meta" | grep -qi "json"

          text=$(curl -sS -f -T "$SAMPLE" \
            -H "Accept: text/plain" \
            -H "Content-Disposition: attachment; filename=values.json" \
            "$BASE/tika")
          echo "$text" | grep -q "readinessProbe"
          echo "$text" | grep -q "securityContext"
      volumeMounts:
        - name: sample
          mountPath: /sample
          readOnly: true
  volumes:
    - name: sample
      configMap:
        name: "{{ include "tika-helm.fullname" . }}-test-values"
  restartPolicy: Never
